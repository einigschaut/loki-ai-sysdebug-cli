name: release-please

# Opens a Release PR the maintainer merges deliberately (SemVer), and -- once that
# merge cuts a release -- attaches a verifiable distribution artifact to it.
#
# release-please tracks Conventional Commits on `main` and, once commits warranting a
# release land (feat -> minor, fix -> patch; pre-1.0 keeps breaking changes on minor),
# opens/updates a standing "Release PR" that bumps version.txt, moves the CHANGELOG
# section, and tags vX.Y.Z on merge. Nothing ships until a human merges that PR -- this
# workflow never publishes on its own. See docs/adr/0005-versioning-and-releases.md.
#
# The second job (publish-assets) runs ONLY on the push that actually created a release.
# It builds a deterministic `git archive` of the tagged tree, attaches it to the GitHub
# Release with a sha256 sidecar, and signs its provenance with a build attestation
# (sigstore, verifiable via `gh attestation verify`). See docs/adr/0028. The two jobs are
# split so the elevated attestation permissions (id-token, attestations) live ONLY on the
# job that needs them and never on ordinary pushes to main (least privilege).
#
# Manifest mode: configuration lives in release-please-config.json and the
# last-released version in .release-please-manifest.json (both at the repo root). The
# `simple` strategy is the one that reads/writes version.txt.

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Surfaced so publish-assets can gate on them without re-running release-please.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Preflight, added after a token renewal failed silently across five runs (2026-08-17/18).
      # Both ways this secret breaks surface as a one-line runner error that names neither the
      # secret nor the remedy: an EMPTY value dies inside the action's own input validation
      # ("Input required and not supplied: token", 4 ms in, before any network call), an EXPIRED
      # one dies later against the API ("Bad credentials"). Attributing either cost a full day --
      # made worse by a GitHub outage that overlapped and offered a plausible wrong explanation.
      # This step names the secret, the failure and the fix, and warns BEFORE the next expiry
      # rather than after it, because the failure mode is silence: no Release PR is ever opened.
      - name: Preflight -- release token present, accepted, not about to expire
        env:
          # Through the environment, never as an argument: argv is readable by every process in
          # the job, this step's environment is not (CLAUDE.md section 5 -- secret never in argv).
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Never `set -x` in this step -- it would echo the curl invocation, token included.

          remedy() {
            echo "Fix: create a fine-grained PAT -- Contents: Read and write, Pull requests: Read"
            echo "     and write, scoped to THIS repository only -- and store it as the repository"
            echo "     secret RELEASE_PLEASE_TOKEN (Settings > Secrets and variables > Actions)."
            echo "Set the value in the WEB form. 'gh secret set' hides the input completely (no"
            echo "echo, no asterisks), so a paste that does not land writes an EMPTY secret and"
            echo "still reports success -- that is the failure which produced this preflight."
          }

          if [ -z "${RELEASE_PLEASE_TOKEN:-}" ]; then
            echo "::error title=RELEASE_PLEASE_TOKEN is empty::The repository secret carries no value, so release-please cannot open a Release PR."
            remedy
            exit 1
          fi

          headers="$(mktemp)"
          # The token reaches curl through a config file on STDIN, not as -H on the command line,
          # for the same argv reason as above.
          set +e
          status="$(printf 'header = "Authorization: Bearer %s"\n' "${RELEASE_PLEASE_TOKEN}" \
            | curl --silent --show-error --config - \
                   --header 'Accept: application/vnd.github+json' \
                   --header 'X-GitHub-Api-Version: 2022-11-28' \
                   --output /dev/null --dump-header "${headers}" --write-out '%{http_code}' \
                   "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}")"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then status='000'; fi

          case "${status}" in
            200) ;;
            401)
              echo "::error title=RELEASE_PLEASE_TOKEN rejected::GitHub answered 401 -- the token is expired or was revoked."
              remedy
              exit 1
              ;;
            403)
              echo "::error title=RELEASE_PLEASE_TOKEN not authorised::GitHub answered 403 -- the token is live but blocked for ${GITHUB_REPOSITORY}."
              remedy
              exit 1
              ;;
            404)
              # A fine-grained PAT that cannot see a repository gets 404, not 403 -- GitHub hides
              # the existence of what the token may not read. So 404 here means wrong scope.
              echo "::error title=RELEASE_PLEASE_TOKEN cannot see this repository::GitHub answered 404 -- the token is not scoped to ${GITHUB_REPOSITORY}."
              remedy
              exit 1
              ;;
            *)
              # Anything else is GitHub being unwell, not a bad token. On 2026-08-17 a partial
              # GitHub outage overlapped a genuine token failure and kept the diagnosis ambiguous
              # for a day; a preflight that turned an outage into a hard stop would recreate that
              # confusion from the other side. Say so, and let release-please report the truth.
              echo "::warning title=Release token not verified::HTTP ${status} while checking the token -- continuing, release-please will report the real outcome."
              exit 0
              ;;
          esac

          expiry="$(grep -i '^github-authentication-token-expiration:' "${headers}" \
            | head -1 | sed 's/^[^:]*: *//' | tr -d '\r' || true)"
          if [ -z "${expiry}" ]; then
            echo "Release token accepted; it carries no expiry date."
            exit 0
          fi

          expiry_epoch="$(date -u -d "${expiry}" +%s 2>/dev/null || true)"
          if [ -z "${expiry_epoch}" ]; then
            echo "Release token accepted; expiry reported as '${expiry}', which this step could not parse."
            exit 0
          fi

          days=$(( (expiry_epoch - $(date -u +%s)) / 86400 ))
          echo "Release token accepted; expires ${expiry} (${days} day(s) left)."
          echo "Release token expires ${expiry} -- ${days} day(s) left." >> "${GITHUB_STEP_SUMMARY}"
          if [ "${days}" -le 14 ]; then
            echo "::warning title=Release token expires soon::RELEASE_PLEASE_TOKEN expires on ${expiry}, ${days} day(s) from now. Renew it before then -- when it lapses, no Release PR is opened and nothing says so."
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Fine-grained PAT, NOT the default GITHUB_TOKEN: a PR opened via GITHUB_TOKEN does not
          # trigger further workflows (GitHub's anti-recursion rule), which would leave every Release
          # PR without CI. Using a PAT makes the Release PR run the normal CI gate before it is merged.
          # Secret RELEASE_PLEASE_TOKEN = a repo-scoped PAT (Contents + Pull requests: RW). The preflight
          # step above fails loudly when it is empty or rejected and warns 14 days before it expires --
          # left to lapse it opens no Release PR and says nothing. See docs/adr/0005-versioning-and-releases.md.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    needs: release-please
    # Only when the Release PR was just merged, i.e. a tag + GitHub Release now exist.
    # On every other push to main this job is skipped entirely.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach the archive + checksum to the Release
      id-token: write       # OIDC token minted for sigstore -- required by the attestation
      attestations: write   # store the provenance attestation on the repo
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # A tag is a single commit, but git archive reads the ref from the local repo, so it
          # must be present. A shallow checkout of exactly the tag is enough and is the default.

      - name: Build the release archive
        id: archive
        run: |
          zip="loki-${TAG}.zip"
          # `git archive` from the tag, NOT GitHub's auto-generated source tarball: the auto tarball
          # is produced on the fly and its bytes -- hence its hash -- are not guaranteed stable, so it
          # cannot be pinned. `git archive` of a fixed commit is deterministic (proven locally: built
          # twice, byte-identical). This is the same tree a `git clone` at the tag would give a
          # technician, so the ZIP is a real substitute for cloning for anyone without git.
          git archive --format=zip --prefix="loki-${TAG}/" "${TAG}" -o "${zip}"
          sha="$(sha256sum "${zip}" | cut -d' ' -f1)"
          size="$(stat -c%s "${zip}")"
          # The sidecar a human and the update script both read: hash + size, the same shape Loki
          # pins every downloaded model with (ADR-0026). This guards transport integrity only -- it
          # sits on the same host as the artifact, so the ATTESTATION below is the real trust anchor.
          {
            echo "sha256:  ${sha}"
            echo "bytes:   ${size}"
            echo "file:    ${zip}"
            echo "verify:  gh attestation verify ${zip} -R ${GITHUB_REPOSITORY}"
          } > "${zip}.sha256"
          echo "zip=${zip}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # Signs "GitHub Actions, this workflow, this commit built exactly this file" into a
          # sigstore-backed attestation. A consumer runs `gh attestation verify <zip> -R <repo>`;
          # this is what a self-hosted sha256 next to the file cannot provide (see ADR-0028).
          subject-path: ${{ steps.archive.outputs.zip }}

      - name: Attach archive + checksum to the Release
        env:
          # The default token with the contents:write above is enough to upload to a Release in
          # this repo, regardless of which identity (the PAT) created the Release object.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.archive.outputs.zip }}
        run: |
          gh release upload "${TAG}" "${ZIP}" "${ZIP}.sha256" --repo "${GITHUB_REPOSITORY}"
